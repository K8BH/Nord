<!DOCTYPE html>
<html>
<head>
    <title>Nord IDE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <div class="sidebar">
        <h2>Nord</h2>

        <button onclick="setExample('hello')">Hello World</button>
        <button onclick="setExample('vars')">Variables</button>
        <button onclick="setExample('loop')">Loop</button>
        <button onclick="setExample('func')">Function</button>
    </div>

    <div class="main">

        <div class="toolbar">
            <select id="target">
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
            </select>

            <button onclick="run()">Run</button>
        </div>

        <textarea id="code"></textarea>

        <div class="panel">
            <div class="panel-title">Output</div>
            <pre id="output"></pre>
        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
